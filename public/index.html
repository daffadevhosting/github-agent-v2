<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Agent</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f6f6f6;
      --border: #e4e4e4;
      --text: #1a1a1a;
      --text-muted: #888888;
      --accent: #1a1a1a;
      --accent-text: #ffffff;
      --error: #c62828;
      --error-bg: #fef0f0;
      --radius: 8px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --mono: "SF Mono", "Fira Code", "Cascadia Code", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .icon {
      width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    header .meta {
      margin-left: auto;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 400;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg {
      max-width: 72%;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: var(--accent-text);
    }

    .msg.assistant {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .msg.error {
      align-self: flex-start;
      background: var(--error-bg);
      border: 1px solid #f0c0c0;
      color: var(--error);
    }

    .msg.thinking {
      align-self: flex-start;
      color: var(--text-muted);
      font-style: italic;
      padding: 8px 0;
      background: none;
      border: none;
      font-size: 13px;
    }

    .msg.thinking::after {
      content: ' ...';
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    #input-bar {
      display: flex;
      gap: 8px;
      padding: 16px 24px;
      border-top: 1px solid var(--border);
    }

    #input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      font-family: var(--font);
      outline: none;
      transition: border-color 0.15s;
    }

    #input:focus {
      border-color: var(--text-muted);
    }

    #send {
      padding: 10px 20px;
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      background: var(--accent);
      color: var(--accent-text);
      font-size: 14px;
      font-family: var(--font);
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    #send:hover { opacity: 0.85; }
    #send:disabled { opacity: 0.35; cursor: not-allowed; }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .empty-state .big {
      font-size: 32px;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <header>
    <div class="icon">🤖</div>
    <h1>GitHub Agent</h1>
    <span class="meta" id="ctx-meta">No repo selected</span>
  </header>
  <div id="messages">
    <div class="empty-state">
      <span class="big">🤖</span>
      <span>Ketik perintah untuk mulai</span>
      <span style="font-size: 12px;">Contoh: "buat repo myproject" atau "help"</span>
    </div>
  </div>
  <div id="input-bar">
    <input id="input" type="text" placeholder="Ketik perintah..." autocomplete="off" />
    <button id="send">Kirim</button>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const ctxMeta = document.getElementById('ctx-meta');

    const wsUrl = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`;
    const ws = new WebSocket(wsUrl);
    let busy = false;
    let firstMessage = true;

    function addMessage(role, content) {
      if (firstMessage) {
        messagesEl.innerHTML = '';
        firstMessage = false;
      }
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = content;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    ws.addEventListener('open', () => {
      console.log('Connected to agent');
    });

    ws.addEventListener('message', (event) => {
      const data = JSON.parse(event.data);

      if (data.type === 'status') {
        addMessage('assistant', data.message);
      } else if (data.type === 'done') {
        const thinking = messagesEl.querySelector('.thinking');
        if (thinking) thinking.remove();
        addMessage('assistant', data.result);
        busy = false;
        sendBtn.disabled = false;
      } else if (data.type === 'thinking') {
        addMessage('thinking', data.message);
        busy = true;
        sendBtn.disabled = true;
      } else if (data.type === 'error') {
        const thinking = messagesEl.querySelector('.thinking');
        if (thinking) thinking.remove();
        addMessage('error', data.message);
        busy = false;
        sendBtn.disabled = false;
      }
    });

    function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || ws.readyState !== WebSocket.OPEN || busy) return;
      addMessage('user', text);
      ws.send(text);
      inputEl.value = '';
    }

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
